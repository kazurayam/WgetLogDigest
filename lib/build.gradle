// WgetLogDigest/lib/build.gradle
plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}


ext {
    GitHubUserName = 'kazurayam'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    mavenLocal()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api libs.commons.math3

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation libs.guava

    // SLF4J を使う
    implementation 'org.slf4j:slf4j-api:2.0.20'
    // Logback を使う
    implementation 'ch.qos.logback:logback-core:1.6.5'
    implementation 'ch.qos.logback:logback-classic:1.6.5'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

// see https://vanniktech.github.io/gradle-maven-publish-plugin/central/ for reference
mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()

    coordinates(project.group.toString(),    // com.kazurayam
            'wget-log-digest',
            project.version.toString()      // e.g, 0.1.0
    )

    pom {
        name = project.rootProject.name
        description = 'A utility class accepts a log of of GNU wget command, parse it to transform the log entries into simpler line-oriented format'
        inceptionYear = '2026'
        url = "https://${GitHubUserName}.github.io/WgetLogDigest/"
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org.licenses/LICENSE-2.0.txt'
                distribution = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = "${GitHubUserName}"
                name = 'URAYAMA,kazuaki'
                url = "https://github.com/${GitHubUserName}/"
            }
        }
        scm {
            url = "https://github.com/${GitHubUserName}/${project.rootProject.name}"
            connection = "scm:git:https://github.com/${GitHubUserName}/${project.rootProject.name}.git"
            developerConnection = "scm:git:git@github.com:${GitHubUserName}/${project.rootProject.name}.git"
        }
    }
}

/* to publish snapshot, run the command:

  $ ./gradlew publishToMavenCentral

and check

  https://central.sonatype.com/repository/maven-snapshots/
 */
