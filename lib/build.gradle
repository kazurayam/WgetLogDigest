// WgetLogDigest/lib/build.gradle
plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group 'com.kazurayam'
version '0.1.0'

ext {
    GitHubUserName = 'kazurayam'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    mavenLocal()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api libs.commons.math3

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation libs.guava

    // SLF4J を使う
    implementation 'org.slf4j:slf4j-api:2.0.20'
    // Logback を使う
    implementation 'ch.qos.logback:logback-core:1.6.5'
    implementation 'ch.qos.logback:logback-classic:1.6.5'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    coordinates(project.group,    // com.kazurayam
            'wget-log-digest',
            project.version)

    pom {
        name.set(project.rootProject.name)
        description.set('A utility class accepts a log of of GNU wget command, parse it to transform the log entries into simpler line-oriented format')
        inceptionYear.set('2026')
        url.set("https://${GitHubUserName}.github.io/WgetLogDigest/")
        licenses {
            license {
                name.set('The Apache License, Version 2.0')
                url.set('https://www.apache.org.licenses/LICENSE-2.0.txt')
                distribution.set('http://www.apache.org/licenses/LICENSE-2.0.txt')
            }
        }
        developers {
            developer {
                id.set("${GitHubUserName}")
                name.set('URAYAMA,kazuaki')
                url.set("https://github.com/${GitHubUserName}/")
            }
        }
        scm {
            connection = "scm:git:https://github.com/${GitHubUserName}/${project.rootProject.name}.git"
            developerConnection = "scm:git:git@github.com:${GitHubUserName}/${project.rootProject.name}.git"
            url = "https://github.com/${GitHubUserName}/${project.rootProject.name}"
        }
    }
}
