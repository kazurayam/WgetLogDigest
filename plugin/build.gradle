plugins {
    // Apply the Java Gradle plugin development plugin to add support for developing Gradle plugins
    id 'java-gradle-plugin'

    // Apply the Groovy plugin to add support for Groovy¶
    id 'groovy'

    // publish my plugin to the Gradle Plugin Portal
    // see https://plugins.gradle.org/u/kazurayam
    id 'com.gradle.plugin-publish' version '2.2.1'
}

group = 'com.kazurayam'
version = '0.1.0-SNAPSHOT'

base {
    archivesName = 'wget-log-digest-plugin'
}

ext {
    isReleaseVersion = !version.endsWith("SNAPSHOT")
}

repositories {
    // Use Maven Central for resolving dependencies.¶
    mavenCentral()
    mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecated"
}

dependencies {
    // Use the awesome Spock testing and specification framework¶
    testImplementation libs.spock.core
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// Add a source set for the functional test suite¶
sourceSets {
    functionalTest {
        java {
            srcDir 'src/functionalTest/java'
            srcDir 'src/functionalTest/groovy'
        }
        resources {
            srcDir 'src/functionalTest/resources'
        }
        compileClasspath + sourceSets.main.runtimeClasspath
    }
}

gradlePlugin {
    // configure the `java-gradle-plugin` so that it looks at the `sourceSets.functionalTest`
    // to find the tests for the custom plugin
    testSourceSets(sourceSets.functionalTest)
    // This makes `org.gradle.testkit.runner.GradleRunner` class available to the
    // functionalTest classes

    website = 'https://github.com/kazurayam/WgetLogDigest/'
    vcsUrl = 'https://github.com/kazurayam/WgetLogDigest/'
    // Define the plugin¶
    plugins {
        register('wgetLogDigest') {
            id = 'com.kazurayam.wget-log-digest'
            displayName = 'transform wget lot into line-oriented format'
            description = 'transform the log file of GNU wget command into simpler line-oriented format so that you can post-process it using the line-oriented filters such as grep, sort, uniq, sed and awk'
            tags.set(['wget', 'log'])
            implementationClass = 'com.kazurayam.wgetlog.DigestPlugin'
        }
    }
}
// How to publish the plugin to the Gradle Plugin Portal?
// $ ./gradlew publishPlugins


configurations.functionalTestImplementation.extendsFrom(configurations.testImplementation)
configurations.functionalTestRuntimeOnly.extendsFrom(configurations.testRuntimeOnly)

// Add a task to run the functional tests¶
tasks.register('functionalTest', Test) {
    testClassesDirs = sourceSets.functionalTest.output.classesDirs
    classpath = sourceSets.functionalTest.runtimeClasspath
    useJUnitPlatform()
}

gradlePlugin.testSourceSets.add(sourceSets.functionalTest)

tasks.named('check') {
    // Run the functional tests as part of `check`¶
    dependsOn(tasks.test, tasks.functionalTest)
}

tasks.named('test') {
    // Use JUnit Jupiter for unit tests.¶
    useJUnitPlatform()
}

